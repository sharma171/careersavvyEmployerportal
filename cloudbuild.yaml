steps:
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']
    env:
      - 'NODE_OPTIONS=--max-old-space-size=4096'
 
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - -c
      - |
        export NODE_OPTIONS=--max-old-space-size=4096
        npm run build
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY